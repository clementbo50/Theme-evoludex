<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="instagram-title instagram-desc">
  <title id="instagram-title">Instagram façon Pokéball</title>
  <desc id="instagram-desc">Logo Instagram blanc sur fond rose au centre d'une Pokéball rouge et blanche.</desc>

  <defs>
    <clipPath id="instagram-ball-clip">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <!-- Base Pokéball -->
  <circle cx="120" cy="120" r="100" fill="#FFFFFF" stroke="#1F2430" stroke-width="8"/>
  <g clip-path="url(#instagram-ball-clip)">
    <path d="M20 120 a100 100 0 0 1 200 0 Z" fill="#E3350D"/>
    <rect x="20" y="111" width="200" height="18" fill="#1F2430"/>
  </g>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#1F2430" stroke-width="8"/>

  <!-- Reflet -->
  <path d="M62 74 A72 72 0 0 1 108 34" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- Logo Instagram simplifié -->
  <g stroke="#1F2430" stroke-width="7">
    <rect x="82" y="88" width="76" height="64" rx="18" fill="#E1306C"/>
  </g>
  <circle cx="120" cy="120" r="14" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <circle cx="142" cy="102" r="5.5" fill="#FFFFFF"/>
</svg>
