<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Visuel par défaut pour une actualité sans image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B5FA6"/>
      <stop offset="0.55" stop-color="#5B4BB7"/>
      <stop offset="1" stop-color="#9C3FA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <circle cx="118" cy="112" r="210" fill="#ffffff" opacity="0.06"/>
  <circle cx="1090" cy="700" r="270" fill="#ffffff" opacity="0.05"/>
  <circle cx="1010" cy="150" r="84" fill="#E3350D" opacity="0.32"/>
  <circle cx="190" cy="690" r="48" fill="#E3350D" opacity="0.38"/>

  <g transform="translate(600 318)">
    <circle r="136" fill="#ffffff" opacity="0.96"/>
    <path d="M-136 0h272" stroke="#1F2430" stroke-width="30"/>
    <circle r="48" fill="#ffffff" stroke="#1F2430" stroke-width="14"/>
    <circle r="14" fill="#E3350D"/>
  </g>

  <text x="600" y="568" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="7">EVOLUDEX</text>
  <text x="600" y="622" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.82" letter-spacing="5">ACTUALITÉ</text>
  <rect x="486" y="658" width="228" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
  <text x="600" y="686" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff" opacity="0.9" letter-spacing="2.5">IMAGE À VENIR</text>
