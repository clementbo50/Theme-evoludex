<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="steam-title steam-desc">
  <title id="steam-title">Steam façon Pokéball</title>
  <desc id="steam-desc">Logo Steam bleu stylisé au centre d'une Pokéball rouge et blanche.</desc>

  <defs>
    <clipPath id="steam-ball-clip">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <!-- Base Pokéball -->
  <circle cx="120" cy="120" r="100" fill="#FFFFFF" stroke="#1F2430" stroke-width="8"/>
  <g clip-path="url(#steam-ball-clip)">
    <path d="M20 120 a100 100 0 0 1 200 0 Z" fill="#E3350D"/>
    <rect x="20" y="111" width="200" height="18" fill="#1F2430"/>
  </g>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#1F2430" stroke-width="8"/>

  <!-- Reflet -->
  <path d="M62 74 A72 72 0 0 1 108 34" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- Logo Steam simplifié -->
  <g stroke-linecap="round">
    <path d="M122 112 L150 90" fill="none" stroke="#1F2430" stroke-width="18"/>
    <path d="M122 112 L150 90" fill="none" stroke="#66C0F4" stroke-width="10"/>
  </g>
  <g stroke="#1F2430" stroke-width="7">
    <circle cx="154" cy="86" r="12" fill="#66C0F4"/>
    <circle cx="100" cy="132" r="27" fill="#66C0F4"/>
  </g>
  <circle cx="100" cy="132" r="9" fill="#1F2430"/>
</svg>
