<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="youtube-title youtube-desc">
  <title id="youtube-title">YouTube façon Pokéball</title>
  <desc id="youtube-desc">Logo YouTube blanc sur fond rouge au centre d'une Pokéball rouge et blanche.</desc>

  <defs>
    <clipPath id="youtube-ball-clip">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <!-- Base Pokéball -->
  <circle cx="120" cy="120" r="100" fill="#FFFFFF" stroke="#1F2430" stroke-width="8"/>
  <g clip-path="url(#youtube-ball-clip)">
    <path d="M20 120 a100 100 0 0 1 200 0 Z" fill="#E3350D"/>
    <rect x="20" y="111" width="200" height="18" fill="#1F2430"/>
  </g>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#1F2430" stroke-width="8"/>

  <!-- Reflet -->
  <path d="M62 74 A72 72 0 0 1 108 34" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- Logo YouTube simplifié -->
  <g stroke="#1F2430" stroke-width="7" stroke-linejoin="round">
    <rect x="68" y="90" width="104" height="66" rx="18" fill="#FF0000"/>
    <path d="M108 104 L108 142 L142 123 Z" fill="#FFFFFF" stroke="#1F2430" stroke-width="5"/>
  </g>
</svg>
